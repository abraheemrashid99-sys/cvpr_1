# Tiny synthetic run, no download, finishes in seconds on CPU.
dataset: synthetic
arch: mlp
nesting: [8, 16, 32, 64]
epochs: 2
batch_size: 64
m_star: 16
poison_frac: 0.3
trigger: badnets
trigger_size: 2
defender_frac: 0.1
synth_n: 600
b_bits: 8
n_c: 256
# Attack weights: poisoned-row CE relative to clean-row CE within each head
# (1 = equal weight). Lower towards poison_frac if clean accuracy dips at m <= m*.
lam_v: 1.0
lam_a: 1.0
